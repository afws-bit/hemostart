<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Novo Hospital - RotaVital</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header><h1>🩸 RotaVital — Banco de Sangue</h1></header>
<nav>
    <a th:href="@{/}">Início</a>
    <a th:href="@{/doadores}">Doadores</a>
    <a th:href="@{/coleta}">Coleta</a>
    <a th:href="@{/estoque}">Estoque</a>
    <a th:href="@{/estoque/validade}">Validade/Descarte</a>
    <a th:href="@{/requisicoes}">Fila de Pedidos</a>
    <a th:href="@{/requisicoes/nova}">Nova Solicitação</a>
    <a th:href="@{/hospitais}">Hospitais</a>
    <a th:href="@{/historico}">Histórico</a>
    <a th:href="@{/historico/rastreio}">Rastreio</a>
    <a th:href="@{/historico/relatorio}">Relatório</a>
    <a th:href="@{/estoque/configurar}">Config. Estoque</a>
    <a th:href="@{/benchmark}">Benchmark</a>
</nav>
<div class="container">
    <div th:if="${sucesso}" class="flash-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="flash-error" th:text="${erro}"></div>

    <h2>Cadastrar Hospital</h2>
    <div class="card">
        <form method="post" th:action="@{/hospitais/salvar}">
            <label for="razaoSocial">Razão Social *</label>
            <input id="razaoSocial" type="text" name="razaoSocial" required>

            <label for="cnpj">CNPJ * (somente números ou com pontuação)</label>
            <input id="cnpj" type="text" name="cnpj" required>

            <label for="endereco">Endereço *</label>
            <input id="endereco" type="text" name="endereco" required>

            <label for="contato">Contato *</label>
            <input id="contato" type="text" name="contato" required>

            <button class="btn" type="submit">Cadastrar Hospital</button>
            <a class="btn btn-gray" th:href="@{/hospitais}" style="margin-left:8px;">Cancelar</a>
        </form>
    </div>
</div>
</body>
</html>
