<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nova Solicitação - RotaVital</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header><h1>🩸 RotaVital — Banco de Sangue</h1></header>
<nav>
    <a th:href="@{/}">Início</a>
    <a th:href="@{/doadores}">Doadores</a>
    <a th:href="@{/coleta}">Coleta</a>
    <a th:href="@{/estoque}">Estoque</a>
    <a th:href="@{/estoque/validade}">Validade/Descarte</a>
    <a th:href="@{/requisicoes}">Fila de Pedidos</a>
    <a th:href="@{/requisicoes/nova}">Nova Solicitação</a>
    <a th:href="@{/hospitais}">Hospitais</a>
    <a th:href="@{/historico}">Histórico</a>
    <a th:href="@{/historico/rastreio}">Rastreio</a>
    <a th:href="@{/historico/relatorio}">Relatório</a>
    <a th:href="@{/estoque/configurar}">Config. Estoque</a>
    <a th:href="@{/benchmark}">Benchmark</a>
</nav>
<div class="container">
    <div th:if="${sucesso}" class="flash-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="flash-error" th:text="${erro}"></div>

    <h2>Nova Solicitação de Sangue por Hospital</h2>
    <div class="card">
        <form method="post" th:action="@{/requisicoes/criar}">
            <label for="cnpjHospital">CNPJ do Hospital *</label>
            <input id="cnpjHospital" type="text" name="cnpjHospital" required
                   placeholder="CNPJ (somente números ou com pontuação)">

            <label for="tipoSanguineo">Tipo Sanguíneo do Paciente *</label>
            <select id="tipoSanguineo" name="tipoSanguineo" required>
                <option value="">Selecione</option>
                <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
            </select>

            <label for="quantidade">Quantidade de Bolsas *</label>
            <input id="quantidade" type="number" name="quantidade" min="1" value="1" required>

            <div class="form-group">
                <label>
                    <input type="checkbox" name="urgente" value="true">
                    Pedido Urgente (será inserido antes dos pedidos normais na fila)
                </label>
            </div>

            <button class="btn" type="submit">Enviar Solicitação</button>
            <a class="btn btn-gray" th:href="@{/requisicoes}" style="margin-left:8px;">Ver Fila</a>
        </form>
    </div>
</div>
</body>
</html>
