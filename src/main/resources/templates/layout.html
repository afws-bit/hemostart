<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RotaVital - Banco de Sangue</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <h1>🩸 RotaVital — Banco de Sangue</h1>
</header>
<nav>
    <a th:href="@{/}">Início</a>
    <a th:href="@{/doadores}">Doadores</a>
    <a th:href="@{/coleta}">Coleta</a>
    <a th:href="@{/estoque}">Estoque</a>
    <a th:href="@{/estoque/validade}">Validade/Descarte</a>
    <a th:href="@{/requisicoes}">Fila de Pedidos</a>
    <a th:href="@{/requisicoes/nova}">Nova Solicitação</a>
    <a th:href="@{/hospitais}">Hospitais</a>
    <a th:href="@{/historico}">Histórico</a>
    <a th:href="@{/historico/rastreio}">Rastreio</a>
    <a th:href="@{/historico/relatorio}">Relatório</a>
    <a th:href="@{/estoque/configurar}">Config. Estoque</a>
    <a th:href="@{/benchmark}">Benchmark</a>
</nav>
<div class="container">
    <div th:if="${sucesso}" class="flash-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="flash-error" th:text="${erro}"></div>
    <th:block th:fragment="content"></th:block>
</div>
</body>
</html>
