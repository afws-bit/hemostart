<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Coleta - RotaVital</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header><h1>🩸 RotaVital — Banco de Sangue</h1></header>
<nav>
    <a th:href="@{/}">Início</a>
    <a th:href="@{/doadores}">Doadores</a>
    <a th:href="@{/coleta}">Coleta</a>
    <a th:href="@{/estoque}">Estoque</a>
    <a th:href="@{/estoque/validade}">Validade/Descarte</a>
    <a th:href="@{/requisicoes}">Fila de Pedidos</a>
    <a th:href="@{/requisicoes/nova}">Nova Solicitação</a>
    <a th:href="@{/hospitais}">Hospitais</a>
    <a th:href="@{/historico}">Histórico</a>
    <a th:href="@{/historico/rastreio}">Rastreio</a>
    <a th:href="@{/historico/relatorio}">Relatório</a>
    <a th:href="@{/estoque/configurar}">Config. Estoque</a>
    <a th:href="@{/benchmark}">Benchmark</a>
</nav>
<div class="container">
    <div th:if="${sucesso}" class="flash-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="flash-error" th:text="${erro}"></div>

    <h2>Registrar Coleta</h2>

    <div class="card">
        <form method="post" th:action="@{/coleta/registrar}">
            <label for="doadorId">Doador *</label>
            <select id="doadorId" name="doadorId" required>
                <option value="">Selecione o doador</option>
                <option th:each="d : ${doadores}"
                        th:value="${d.id}"
                        th:text="${d.nome + ' — ' + d.tipoSanguineo + ' (CPF: ' + d.cpf + ')'}">
                </option>
            </select>

            <label for="componente">Componente *</label>
            <select id="componente" name="componente" required>
                <option value="">Selecione</option>
                <option th:each="c : ${componentes}" th:value="${c}" th:text="${c}"></option>
            </select>

            <label for="volume">Volume (ml) *</label>
            <input id="volume" type="number" name="volume" min="100" max="600" value="450" required>

            <button class="btn" type="submit">Registrar Coleta</button>
        </form>
    </div>
</div>
</body>
</html>
