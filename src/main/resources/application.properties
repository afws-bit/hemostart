# Nome usado como tag application nas métricas, nos logs (Loki) e como service.name nos traces (Tempo)
spring.application.name=hemostart
server.port=8080

# ===================== Banco de dados =====================
# Sem variáveis de ambiente: usa H2 em arquivo (./data/rotavital.mv.db) — basta rodar `mvn spring-boot:run`.
# No Docker Compose / Render: as variáveis SPRING_DATASOURCE_* apontam para o PostgreSQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/rotavital;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Console web do H2 (somente quando o H2 está em uso): http://localhost:8080/h2-console
spring.h2.console.enabled=true

scheduling.interval.ms=60000

# Painel de rede (RSD): intervalo da sonda Aplicação → banco (SELECT 1)
monitoramento.sonda.intervalo.ms=5000
spring.thymeleaf.cache=false

# ===================== Observabilidade (RSD U2) =====================
# Por padrão (Render, execução local) só /actuator/health fica exposto e na mesma porta da aplicação.
# No ambiente de observabilidade (observabilidade/docker-compose.yml) as variáveis abaixo abrem
# health, info, metrics e prometheus numa porta separada (8081), alcançável só pela rede interna do Docker.
management.server.port=${MANAGEMENT_SERVER_PORT:${server.port}}
management.endpoints.web.exposure.include=${ACTUATOR_EXPOSICAO:health}
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETALHES:never}
management.info.env.enabled=true
info.app.nome=HemoStart / Rota Vital
info.app.descricao=Gestão de banco de sangue - Projeto Integrador ADS 2026.2
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.hemostart.alocacao.duracao=true

# Traces (Tempo). Desligados por padrão; o docker-compose liga e aponta para o Tempo.
management.tracing.enabled=${TRACING_HABILITADO:false}
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
# traceId e spanId em toda linha de log: o Grafana usa isso para ir do log (Loki) ao trace (Tempo)
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# Endpoint /api/teste/erro (gera HTTP 500 de propósito para a demonstração). Só no ambiente de observabilidade.
observabilidade.endpoints-teste.habilitado=${ENDPOINTS_TESTE_HABILITADOS:false}
