spring.datasource.url=jdbc:h2:mem:rotavital_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
scheduling.interval.ms=3600000
rotavital.dados-iniciais=false
spring.application.name=hemostart
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.tags.application=hemostart
management.tracing.enabled=false
observabilidade.endpoints-teste.habilitado=true
