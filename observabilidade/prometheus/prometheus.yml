# Prometheus do HemoStart: um job para a aplicação e um para cada exporter.
# Todos os alvos ficam na rede interna "observabilidade" do Docker Compose.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    ambiente: lab

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Aplicação do Projeto Integrador: Actuator na porta de gerenciamento 8081 (não publicada)
  - job_name: hemostart
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["hemostart:8081"]
        labels:
          ambiente: lab

  # Infraestrutura: host e contêineres
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Opcional (R3): banco de dados da aplicação
  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Saúde da própria stack de observabilidade
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
